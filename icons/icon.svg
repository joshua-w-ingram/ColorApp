<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Color circles -->
  <circle cx="200" cy="200" r="100" fill="#ef4444" opacity="0.9"/>
  <circle cx="312" cy="200" r="100" fill="#22c55e" opacity="0.9"/>
  <circle cx="256" cy="312" r="100" fill="#3b82f6" opacity="0.9"/>
  <!-- Overlapping areas create new colors -->
  <circle cx="256" cy="230" r="40" fill="#fbbf24" opacity="0.8"/>
  <circle cx="215" cy="280" r="40" fill="#a855f7" opacity="0.8"/>
  <circle cx="297" cy="280" r="40" fill="#06b6d4" opacity="0.8"/>
  <circle cx="256" cy="260" r="25" fill="#ffffff" opacity="0.9"/>
</svg>
